name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          BIN_NAME="lyco${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          TAG="${{ github.ref_name }}"
          # Strip 'v' prefix for version
          VERSION="${TAG#v}"
          ARCHIVE="lyco-${VERSION}-${{ matrix.target }}"

          mkdir -p dist

          RELEASE_DIR="target/${{ matrix.target }}/release"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Raw binary
            cp "$SRC" "dist/lyco-${{ matrix.target }}${{ matrix.ext }}"
            # Zip archive (cargo-binstall)
            (cd "$RELEASE_DIR" && 7z a "../../../dist/${ARCHIVE}.zip" "$BIN_NAME")
            # WiX MSI
            choco install wixtoolset -y --no-progress 2>&1 | tail -3 || true
            WIX_DIR="/c/Program Files (x86)/WiX Toolset v5.0/bin"
            if [[ -d "$WIX_DIR" ]]; then
              export PATH="$PATH:$WIX_DIR"
              cd wix
              sed -i "s/Version=\".*\"/Version=\"${VERSION}\"/" install.wxs
              candle.exe install.wxs -arch x64 -out install.wixobj
              light.exe install.wixobj -out "../dist/lyco-${VERSION}-x86_64.msi"
              cd ..
              echo "MSI created"
            else
              echo "WiX not found, skipping MSI"
            fi
          else
            # Linux / macOS
            cp "$SRC" "dist/lyco-${{ matrix.target }}"
            (cd "$RELEASE_DIR" && tar czf "../../../dist/${ARCHIVE}.tar.gz" "$BIN_NAME")
          fi

      - name: Check dynamic deps
        shell: bash
        run: |
          echo "=== Dynamic Dependencies ==="
          BIN="target/${{ matrix.target }}/release/lyco${{ matrix.ext }}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ldd "$BIN"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "$BIN"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            dumpbin /dependents "$BIN" 2>/dev/null | grep -i ".dll" || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lyco-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
