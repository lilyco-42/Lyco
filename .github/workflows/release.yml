name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lyco.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lyco
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lyco

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check dynamic deps
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          echo "=== Binary: $BIN ==="
          file "$BIN" || true
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "--- ldd ---"
            ldd "$BIN" || true
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "--- otool -L ---"
            otool -L "$BIN" || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "--- dumpbin ---"
            dumpbin /dependents "$BIN" 2>/dev/null | grep -i ".dll" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyco-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lyco-*
          merge-multiple: true
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir -p dist
          ls -R artifacts/
          for d in artifacts/*/; do
            for f in "$d"*; do
              cp "$f" dist/
            done
          done
          mv dist/lyco.exe dist/lyco-windows-x86_64.exe 2>/dev/null || true
          mv dist/lyco dist/lyco-linux-x86_64 2>/dev/null || true
          ls dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
