name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lyco-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: lyco-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: lyco-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/lyco.exe "${{ matrix.bin }}"
          else
            cp target/${{ matrix.target }}/release/lyco "${{ matrix.bin }}"
          fi

      - name: Check dynamic deps
        shell: bash
        run: |
          echo "=== Binary: ${{ matrix.bin }} ==="
          file "${{ matrix.bin }}" || true
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ldd "${{ matrix.bin }}"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "${{ matrix.bin }}"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            dumpbin /dependents "${{ matrix.bin }}" 2>/dev/null | grep -i ".dll" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: ${{ matrix.bin }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lyco-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
