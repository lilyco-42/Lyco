name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy
          key: renpy-8.5.2

      - name: Download Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          curl -sLo renpy.tar.bz2 \
            https://www.renpy.org/dl/8.5.2/renpy-8.5.2-sdk.tar.bz2
          tar xjf renpy.tar.bz2
          mv renpy-8.5.2-sdk renpy

      - name: Install Android SDK
        run: |
          mkdir -p renpy/rapt/Sdk/cmdline-tools/latest
          curl -sLo cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d renpy/rapt/Sdk/cmdline-tools/latest
          mv renpy/rapt/Sdk/cmdline-tools/latest/cmdline-tools/* \
             renpy/rapt/Sdk/cmdline-tools/latest/
          rm -rf renpy/rapt/Sdk/cmdline-tools/latest/cmdline-tools
          yes | renpy/rapt/Sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore renpy/android.keystore \
            -alias renpy -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android -keypass android \
            -dname "CN=RenPy, O=RenPy, C=US"
          keytool -genkey -v -keystore renpy/bundle.keystore \
            -alias renpy -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass android -keypass android \
            -dname "CN=RenPy, O=RenPy, C=US"

      - name: Configure android.json
        run: |
          cat > android.json << 'EOF'
          {
            "expansion": false,
            "google_play_key": null,
            "google_play_salt": null,
            "heap_size": null,
            "icon_name": "Lyco",
            "include_pil": false,
            "include_sqlite": false,
            "layout": null,
            "name": "Lyco",
            "numeric_version": ${{ github.run_number }},
            "orientation": "sensorLandscape",
            "package": "com.lyco.game",
            "permissions": ["VIBRATE"],
            "randomize_keys": false,
            "source": false,
            "store": "none",
            "update_always": true,
            "update_icons": true,
            "update_keystores": false,
            "version": "${{ github.ref_name }}"
          }
          EOF

      - name: Configure local.properties
        run: |
          mkdir -p renpy/rapt/project
          cat > renpy/rapt/project/local.properties << 'EOF'
          sdk.dir=${{ github.workspace }}/renpy/rapt/Sdk
          key.store=${{ github.workspace }}/renpy/android.keystore
          key.store.password=android
          key.alias=renpy
          key.alias.password=android
          EOF
          cp renpy/rapt/project/local.properties renpy/rapt/project/bundle.properties

      - name: Build APK
        run: |
          renpy/renpy.sh renpy \
            android_build "${{ github.workspace }}" 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyco-Android
          path: renpy/rapt/bin/*.apk
