  <ellipse cx="958" cy="264" rx="38" ry="44" fill="url(#skin)"/>
  <!-- Eyes (downcast, sad) -->
  <path d="M944 264 L950 266" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M966 266 L972 264" stroke="#3a3a3a" stroke-width="1.5"/>
