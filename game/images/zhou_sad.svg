  <path d="M958 270 L956 280 L962 280" stroke="#8a7a5a" stroke-width="1" fill="none"/>
  <!-- Mouth (sad frown) -->
  <path d="M950 288 L958 285 L966 288" stroke="#7a6a5a" stroke-width="1.5" fill="none"/>
  <!-- Neck -->
  <rect x="946" y="304" width="24" height="25" fill="url(#skin)"/>
  <!-- Collar -->
  <path d="M923 329 L946 317 L958 332 L970 317 L993 329" fill="#6a7a6a" stroke="#7a8a7a" stroke-width="1"/>
  <!-- Coat body -->
  <path d="M898 332 L908 324 L958 337 L1008 324 L1018 332 L1018 692 L1003 712 L913 712 L898 692Z" fill="url(#coat)"/>
  <line x1="958" y1="337" x2="958" y2="700" stroke="#5a6a5a" stroke-width="1.5"/>
  <!-- Arms at sides -->
  <path d="M898 332 Q870 410 870 510 Q870 550 888 570" fill="url(#coat)" stroke="#6a7a6a" stroke-width="1"/>
  <path d="M1018 332 Q1046 410 1046 510 Q1046 550 1028 570" fill="url(#coat)" stroke="#6a7a6a" stroke-width="1"/>
  <ellipse cx="886" cy="560" rx="13" ry="18" fill="url(#skin)"/>
  <ellipse cx="1030" cy="560" rx="13" ry="18" fill="url(#skin)"/>
  <!-- Skirt -->
  <path d="M913 707 L923 700 L958 700 L993 700 L1003 707 L1013 892 L998 922 L918 922 L903 892Z" fill="url(#skirt)"/>
  <!-- Boots -->
  <path d="M903 907 L918 900 L998 900 L1013 907 L1018 942 L1006 952 L910 952 L898 942Z" fill="#3a4a3a"/>
  <rect x="898" y="942" width="120" height="10" rx="2" fill="#2a3a2a"/>
