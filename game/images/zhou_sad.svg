    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5a4a"/>
      <stop offset="100%" stop-color="#3a4a3a"/>
    </linearGradient>
  </defs>
  <ellipse cx="960" cy="1005" rx="110" ry="14" fill="#000" opacity="0.15"/>
  <!-- Hair (head slightly down) -->
  <ellipse cx="958" cy="252" rx="52" ry="60" fill="#3a3a3a"/>
  <path d="M906 252 Q918 192 958 190 Q998 192 1010 252" fill="#3a3a3a"/>
  <path d="M906 252 Q898 292 908 332 Q913 352 918 362" stroke="#3a3a3a" stroke-width="4" fill="none"/>
  <path d="M1010 252 Q1018 292 1008 332 Q1003 352 998 362" stroke="#3a3a3a" stroke-width="4" fill="none"/>
  <circle cx="918" cy="362" r="4" fill="#5a5a5a"/>
  <circle cx="998" cy="362" r="4" fill="#5a5a5a"/>
