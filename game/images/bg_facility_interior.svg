<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="corridor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Corridor perspective -->
  <polygon points="0,0 1920,0 1920,1080 0,1080" fill="url(#corridor)"/>
  <!-- Ceiling -->
  <rect width="1920" height="200" fill="#1a1a28"/>
  <!-- Ceiling lights -->
  <rect x="300" y="80" width="100" height="10" fill="#3a3a4a"/>
  <rect x="800" y="80" width="100" height="10" fill="#3a3a4a"/>
  <rect x="1300" y="80" width="100" height="10" fill="#3a3a4a"/>
  <rect x="1700" y="80" width="100" height="10" fill="#3a3a4a"/>
  <!-- Wall -->
  <rect y="200" width="1920" height="500" fill="#1a1a28"/>
  <!-- Doors along corridor -->
  <rect x="100" y="300" width="100" height="200" fill="#2a2a3a"/>
  <rect x="110" y="310" width="80" height="180" fill="#1a1a28"/>
  <rect x="400" y="300" width="100" height="200" fill="#2a2a3a"/>
  <rect x="410" y="310" width="80" height="180" fill="#1a1a28"/>
  <rect x="1400" y="300" width="100" height="200" fill="#2a2a3a"/>
  <rect x="1410" y="310" width="80" height="180" fill="#1a1a28"/>
  <rect x="1700" y="300" width="100" height="200" fill="#2a2a3a"/>
  <rect x="1710" y="310" width="80" height="180" fill="#1a1a28"/>
  <!-- Door handles -->
  <circle cx="180" cy="400" r="3" fill="#4a4a5a"/>
  <circle cx="480" cy="400" r="3" fill="#4a4a5a"/>
  <circle cx="1480" cy="400" r="3" fill="#4a4a5a"/>
  <circle cx="1780" cy="400" r="3" fill="#4a4a5a"/>
  <!-- Floor -->
  <rect y="700" width="1920" height="380" fill="#14141e"/>
  <!-- Floor line -->
  <line x1="0" y1="700" x2="1920" y2="700" stroke="#2a2a3a" stroke-width="2"/>
</svg>