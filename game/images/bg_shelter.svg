<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a30"/>
      <stop offset="100%" stop-color="#2a2a22"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Lamp glow -->
  <rect width="1920" height="1080" fill="url(#lamp)"/>
  <!-- Shelter bunks -->
  <rect x="200" y="400" width="300" height="200" fill="#2a2a22" rx="3"/>
  <rect x="200" y="410" width="300" height="15" fill="#3a3a30"/>
  <rect x="200" y="575" width="300" height="15" fill="#3a3a30"/>
  <rect x="600" y="400" width="300" height="200" fill="#2a2a22" rx="3"/>
  <rect x="600" y="410" width="300" height="15" fill="#3a3a30"/>
  <rect x="600" y="575" width="300" height="15" fill="#3a3a30"/>
  <!-- Supply shelves -->
  <rect x="1100" y="300" width="200" height="400" fill="#2a2a22"/>
  <line x1="1100" y1="400" x2="1300" y2="400" stroke="#3a3a30" stroke-width="2"/>
  <line x1="1100" y1="500" x2="1300" y2="500" stroke="#3a3a30" stroke-width="2"/>
  <line x1="1100" y1="600" x2="1300" y2="600" stroke="#3a3a30" stroke-width="2"/>
  <!-- Supplies -->
  <rect x="1110" y="310" width="30" height="90" fill="#4a4a3a"/>
  <rect x="1150" y="320" width="25" height="80" fill="#3a4a3a"/>
  <rect x="1180" y="315" width="20" height="85" fill="#4a3a3a"/>
  <!-- Floor -->
  <rect y="700" width="1920" height="380" fill="#1a1a14"/>
  <!-- Chair -->
  <rect x="800" y="640" width="60" height="60" fill="#2a2a22" rx="3"/>
</svg>