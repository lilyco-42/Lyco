<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="100%" stop-color="#14181e"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#446688" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#446688" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Monitor -->
  <rect x="750" y="300" width="420" height="300" fill="#0a0a14" rx="4"/>
  <rect x="760" y="310" width="400" height="280" fill="#1a2a3a" rx="2"/>
  <!-- Screen glow -->
  <rect width="1920" height="1080" fill="url(#screen)"/>
  <!-- Screen data lines -->
  <line x1="780" y1="340" x2="1140" y2="340" stroke="#446688" stroke-width="1" opacity="0.5"/>
  <line x1="780" y1="360" x2="900" y2="360" stroke="#446688" stroke-width="1" opacity="0.3"/>
  <line x1="780" y1="380" x2="1080" y2="380" stroke="#446688" stroke-width="1" opacity="0.4"/>
  <line x1="780" y1="520" x2="1140" y2="520" stroke="#446688" stroke-width="1" opacity="0.5"/>
  <!-- Monitor stand -->
  <rect x="940" y="600" width="40" height="50" fill="#2a2a3a"/>
  <rect x="900" y="650" width="120" height="15" fill="#2a2a3a" rx="2"/>
  <!-- Keyboard -->
  <rect x="830" y="680" width="280" height="30" fill="#2a2a3a" rx="2"/>
  <!-- Disk drive tower -->
  <rect x="1300" y="450" width="60" height="200" fill="#2a2a3a"/>
  <rect x="1305" y="470" width="50" height="5" fill="#3a3a4a"/>
  <rect x="1305" y="530" width="50" height="5" fill="#3a3a4a"/>
  <rect x="1305" y="590" width="50" height="5" fill="#3a3a4a"/>
  <!-- Power LED -->
  <circle cx="1330" cy="465" r="2" fill="#44ff44" opacity="0.6"/>
  <!-- Desk -->
  <rect x="700" y="700" width="800" height="20" fill="#2a2a30" rx="2"/>
  <rect x="720" y="720" width="15" height="200" fill="#2a2a30"/>
  <rect x="1460" y="720" width="15" height="200" fill="#2a2a30"/>
  <!-- Chair -->
  <rect x="920" y="740" width="80" height="90" fill="#2a2a30" rx="5"/>
</svg>