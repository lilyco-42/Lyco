<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181828"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="screen_glow" cx="0.5" cy="0.45" r="0.3">
      <stop offset="0%" stop-color="#446688" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#446688" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Main screen wall -->
  <rect x="200" y="100" width="1520" height="500" fill="#141422"/>
  <!-- Main display -->
  <rect x="250" y="120" width="1420" height="460" fill="#0a0a18" rx="4"/>
  <!-- Screen content - waveform -->
  <path d="M300 350 Q350 300 400 350 Q450 400 500 350 Q550 300 600 350 Q650 400 700 350 Q750 300 800 350 Q850 400 900 350 Q950 300 1000 350 Q1050 400 1100 350 Q1150 300 1200 350 Q1250 400 1300 350 Q1350 300 1400 350 Q1450 400 1500 350 Q1550 300 1600 350" stroke="#4488aa" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Progress bar -->
  <rect x="500" y="500" width="400" height="15" fill="#2a2a3a" rx="3"/>
  <rect x="500" y="500" width="188" height="15" fill="#4488aa" rx="3" opacity="0.5"/>
  <!-- Text on screen -->
  <rect x="300" y="150" width="200" height="8" fill="#4488aa" opacity="0.4"/>
  <rect x="300" y="170" width="300" height="6" fill="#4488aa" opacity="0.3"/>
  <rect x="300" y="190" width="250" height="6" fill="#4488aa" opacity="0.25"/>
  <!-- Screen glow -->
  <rect width="1920" height="1080" fill="url(#screen_glow)"/>
  <!-- Console/desk -->
  <rect x="150" y="620" width="1620" height="30" fill="#2a2a3a" rx="2"/>
  <rect x="170" y="650" width="20" height="200" fill="#2a2a3a"/>
  <rect x="1730" y="650" width="20" height="200" fill="#2a2a3a"/>
  <!-- Keyboard -->
  <rect x="600" y="660" width="400" height="25" fill="#2a2a3a" rx="2"/>
  <!-- Chair -->
  <rect x="800" y="700" width="100" height="120" fill="#2a2a3a" rx="5"/>
  <!-- Note on keyboard -->
  <rect x="610" y="650" width="60" height="10" fill="#8a7a5a" opacity="0.6"/>
  <!-- Floor -->
  <rect y="750" width="1920" height="330" fill="#141420"/>
</svg>