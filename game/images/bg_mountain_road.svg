<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="50%" stop-color="#4a4438"/>
      <stop offset="100%" stop-color="#5a5040"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Distant mountains -->
  <path d="M0 500 Q200 400 400 450 Q600 380 800 430 Q1000 370 1200 420 Q1400 360 1600 410 Q1800 380 1920 430 L1920 600 L0 600Z" fill="url(#mountain)" opacity="0.4"/>
  <!-- Closer mountains -->
  <path d="M0 600 Q300 500 600 550 Q900 480 1200 540 Q1500 500 1920 560 L1920 650 L0 650Z" fill="#3a3830" opacity="0.6"/>
  <!-- Winding road -->
  <path d="M0 700 Q200 680 400 690 Q600 700 800 670 Q1000 640 1200 660 Q1400 680 1600 650 Q1800 630 1920 640" stroke="#4a4438" stroke-width="60" fill="none"/>
  <path d="M0 700 Q200 680 400 690 Q600 700 800 670 Q1000 640 1200 660 Q1400 680 1600 650 Q1800 630 1920 640" stroke="#3a3428" stroke-width="4" fill="none" stroke-dasharray="40,30"/>
  <!-- Valley -->
  <rect y="700" width="1920" height="380" fill="#2a2820"/>
  <!-- Ash haze -->
  <rect width="1920" height="1080" fill="#aaa" opacity="0.06"/>
</svg>