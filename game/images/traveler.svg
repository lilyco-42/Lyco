<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b898"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6a5a"/>
      <stop offset="100%" stop-color="#5a4a3a"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a2a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
  </defs>
  <ellipse cx="960" cy="1000" rx="130" ry="17" fill="#000" opacity="0.2"/>
  <!-- Hair (messy) -->
  <ellipse cx="960" cy="252" rx="52" ry="60" fill="#4a3a2a"/>
  <path d="M908 252 Q920 192 960 190 Q1000 192 1012 252" fill="#4a3a2a"/>
  <!-- Face -->
  <ellipse cx="960" cy="264" rx="40" ry="48" fill="url(#skin)"/>
  <!-- Eyes -->
  <ellipse cx="946" cy="260" rx="6" ry="3" fill="#3a3a3a"/>
  <ellipse cx="974" cy="260" rx="6" ry="3" fill="#3a3a3a"/>
  <!-- Eyebrows -->
  <path d="M938 252 L952 255" stroke="#3a3a2a" stroke-width="1.5"/>
  <path d="M968 255 L982 252" stroke="#3a3a2a" stroke-width="1.5"/>
  <!-- Nose -->
  <path d="M960 270 L958 280 L962 280" stroke="#8a7a5a" stroke-width="1" fill="none"/>
  <!-- Mouth -->
  <path d="M950 288 Q960 291 970 288" stroke="#7a6a5a" stroke-width="1.5" fill="none"/>
  <!-- Stubble -->
  <path d="M940 280 L945 282 M955 282 L958 284 M970 280 L975 282" stroke="#8a7a5a" stroke-width="0.5" opacity="0.5"/>
  <!-- Neck -->
  <rect x="945" y="308" width="30" height="25" fill="url(#skin)"/>
  <!-- Collar -->
  <path d="M920 333 L945 318 L960 338 L975 318 L1000 333" fill="#5a4a3a" stroke="#6a5a4a" stroke-width="1"/>
  <!-- Coat body -->
  <path d="M888 336 L898 326 L960 341 L1022 326 L1032 336 L1032 700 L1012 720 L908 720 L888 700Z" fill="url(#coat)"/>
  <line x1="960" y1="341" x2="960" y2="710" stroke="#5a4a3a" stroke-width="2"/>
  <!-- Backpack straps -->
  <path d="M920 340 L900 450 L900 550" stroke="#4a3a2a" stroke-width="4" fill="none"/>
  <path d="M1000 340 L1020 450 L1020 550" stroke="#4a3a2a" stroke-width="4" fill="none"/>
  <!-- Arms -->
  <path d="M888 336 Q855 415 855 515 Q855 555 875 575" fill="url(#coat)" stroke="#5a4a3a" stroke-width="1"/>
  <path d="M1032 336 Q1065 415 1065 515 Q1065 555 1045 575" fill="url(#coat)" stroke="#5a4a3a" stroke-width="1"/>
  <ellipse cx="870" cy="565" rx="14" ry="19" fill="url(#skin)"/>
  <ellipse cx="1050" cy="565" rx="14" ry="19" fill="url(#skin)"/>
  <!-- Pants -->
  <path d="M908 710 L918 700 L960 700 L1002 700 L1012 710 L1022 900 L1002 930 L918 930 L898 900Z" fill="url(#pants)"/>
  <!-- Boots -->
  <path d="M898 910 L918 900 L1002 900 L1022 910 L1027 950 L1012 960 L908 960 L893 950Z" fill="#3a2a1a"/>
  <rect x="893" y="950" width="134" height="12" rx="3" fill="#2a1a0a"/>
</svg>
