<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="60%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#4a4a52"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#2a2a34"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Mountains behind -->
  <path d="M0 500 Q400 420 800 460 Q1200 400 1600 450 Q1800 430 1920 470 L1920 600 L0 600Z" fill="#2a2a34" opacity="0.4"/>
  <!-- Building -->
  <rect x="700" y="350" width="500" height="250" fill="url(#building)"/>
  <rect x="690" y="340" width="520" height="15" fill="#4a4a54"/>
  <!-- No windows - blank walls -->
  <!-- Door -->
  <rect x="930" y="480" width="80" height="120" fill="#1a1a24"/>
  <rect x="930" y="480" width="40" height="120" fill="#1a1a24"/>
  <rect x="970" y="480" width="40" height="120" fill="#14141e" opacity="0.5"/>
  <!-- Antenna array on roof -->
  <line x1="800" y1="340" x2="800" y2="280" stroke="#5a5a64" stroke-width="2"/>
  <line x1="790" y1="300" x2="810" y2="300" stroke="#5a5a64" stroke-width="1.5"/>
  <line x1="1100" y1="340" x2="1100" y2="270" stroke="#5a5a64" stroke-width="2"/>
  <line x1="1090" y1="290" x2="1110" y2="290" stroke="#5a5a64" stroke-width="1.5"/>
  <!-- Dish antenna -->
  <ellipse cx="1200" cy="380" rx="25" ry="15" fill="#4a4a54" transform="rotate(-20 1200 380)"/>
  <line x1="1200" y1="380" x2="1220" y2="365" stroke="#5a5a64" stroke-width="1.5"/>
  <!-- Ground -->
  <rect y="600" width="1920" height="480" fill="url(#ground)"/>
  <!-- Ash particles -->
  <circle cx="300" cy="200" r="2" fill="#888" opacity="0.1"/>
  <circle cx="800" cy="150" r="1.5" fill="#888" opacity="0.08"/>
  <circle cx="1300" cy="250" r="2" fill="#888" opacity="0.1"/>
  <circle cx="500" cy="400" r="1.2" fill="#888" opacity="0.06"/>
</svg>