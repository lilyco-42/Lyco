<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#b8a888"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a5a"/>
      <stop offset="100%" stop-color="#6a5a4a"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a2a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
  </defs>
  <ellipse cx="960" cy="1000" rx="110" ry="14" fill="#000" opacity="0.15"/>
  <!-- Hair (shorter, youthful) -->
  <ellipse cx="960" cy="238" rx="48" ry="58" fill="#4a4a3a"/>
  <path d="M912 238 Q922 178 960 176 Q998 178 1008 238" fill="#4a4a3a"/>
  <!-- Face -->
  <ellipse cx="960" cy="248" rx="36" ry="44" fill="url(#skin)"/>
  <!-- Eyes (bright) -->
  <ellipse cx="947" cy="245" rx="6" ry="4" fill="#3a3a3a"/>
  <ellipse cx="973" cy="245" rx="6" ry="4" fill="#3a3a3a"/>
  <!-- Eyebrows -->
  <path d="M940 237 L952 239" stroke="#4a4a3a" stroke-width="1.5"/>
  <path d="M968 239 L980 237" stroke="#4a4a3a" stroke-width="1.5"/>
  <!-- Nose -->
  <path d="M960 253 L958 261 L962 261" stroke="#8a7a5a" stroke-width="1" fill="none"/>
  <!-- Mouth (smiling) -->
  <path d="M952 268 Q960 273 968 268" stroke="#7a6a5a" stroke-width="1.5" fill="none"/>
  <!-- Neck -->
  <rect x="948" y="288" width="24" height="22" fill="url(#skin)"/>
  <!-- Collar -->
  <path d="M930 310 L948 300 L960 312 L972 300 L990 310" fill="#6a5a4a" stroke="#7a6a5a" stroke-width="1"/>
  <!-- Jacket body -->
  <path d="M905 313 L915 305 L960 318 L1005 305 L1015 313 L1015 680 L1000 700 L920 700 L905 680Z" fill="url(#jacket)"/>
  <line x1="960" y1="318" x2="960" y2="690" stroke="#6a5a4a" stroke-width="1.5"/>
  <!-- Arms -->
  <path d="M905 313 Q880 395 880 495 Q880 535 895 555" fill="url(#jacket)" stroke="#6a5a4a" stroke-width="1"/>
  <path d="M1015 313 Q1040 395 1040 495 Q1040 535 1025 555" fill="url(#jacket)" stroke="#6a5a4a" stroke-width="1"/>
  <ellipse cx="893" cy="545" rx="13" ry="17" fill="url(#skin)"/>
  <ellipse cx="1027" cy="545" rx="13" ry="17" fill="url(#skin)"/>
  <!-- Pants -->
  <path d="M915 695 L925 688 L960 688 L995 688 L1005 695 L1015 880 L1000 910 L920 910 L905 880Z" fill="url(#pants)"/>
  <!-- Boots -->
  <path d="M905 895 L920 888 L1000 888 L1015 895 L1020 930 L1008 940 L912 940 L900 930Z" fill="#3a2a1a"/>
  <rect x="900" y="930" width="120" height="10" rx="2" fill="#2a1a0a"/>
</svg>
