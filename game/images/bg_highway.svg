<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a30"/>
      <stop offset="60%" stop-color="#4a4a3a"/>
      <stop offset="100%" stop-color="#5a5a4a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5a4a"/>
      <stop offset="50%" stop-color="#4a4a3a"/>
      <stop offset="100%" stop-color="#5a5a4a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Distant hills -->
  <path d="M0 500 Q300 450 600 480 Q900 430 1200 470 Q1500 440 1920 480 L1920 600 L0 600Z" fill="#4a4a3a" opacity="0.5"/>
  <!-- Highway -->
  <polygon points="0,650 1920,650 1920,700 0,700" fill="#4a4438"/>
  <!-- Road lines -->
  <line x1="0" y1="675" x2="1920" y2="675" stroke="#6a6a5a" stroke-width="2" stroke-dasharray="100,70"/>
  <!-- Road shoulders -->
  <rect y="640" width="1920" height="10" fill="#3a3a30"/>
  <rect y="700" width="1920" height="10" fill="#3a3a30"/>
  <!-- Ground -->
  <rect y="710" width="1920" height="370" fill="#3a3028"/>
  <!-- Guardrail -->
  <line x1="0" y1="645" x2="1920" y2="645" stroke="#5a5a4a" stroke-width="3"/>
  <!-- Ash haze -->
  <rect width="1920" height="1080" fill="#aaa" opacity="0.06"/>
</svg>