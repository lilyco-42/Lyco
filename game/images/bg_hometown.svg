<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="50%" stop-color="#5a4a3a"/>
      <stop offset="100%" stop-color="#6a5a4a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#4a3a22"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Distant buildings -->
  <rect x="100" y="500" width="80" height="120" fill="#4a3a2a" opacity="0.5"/>
  <rect x="200" y="520" width="60" height="100" fill="#4a3a2a" opacity="0.5"/>
  <rect x="300" y="490" width="70" height="130" fill="#4a3a2a" opacity="0.5"/>
  <!-- Traditional roof buildings -->
  <polygon points="400,520 450,470 500,520" fill="#5a4a30"/>
  <rect x="400" y="520" width="100" height="80" fill="#4a3a22"/>
  <rect x="408" y="530" width="20" height="25" fill="#3a2a14"/>
  <rect x="470" y="530" width="20" height="25" fill="#3a2a14"/>
  <polygon points="550,530 600,480 650,530" fill="#5a4a30"/>
  <rect x="550" y="530" width="100" height="70" fill="#4a3a22"/>
  <!-- Road -->
  <polygon points="0,620 1920,620 1920,700 0,700" fill="#4a4430"/>
  <!-- Road line -->
  <line x1="0" y1="660" x2="1920" y2="660" stroke="#6a5a40" stroke-width="2" stroke-dasharray="80,60"/>
  <!-- Trees -->
  <circle cx="150" cy="580" r="40" fill="#3a4a2a" opacity="0.6"/>
  <circle cx="700" cy="570" r="35" fill="#3a4a2a" opacity="0.5"/>
  <circle cx="1600" cy="560" r="45" fill="#3a4a2a" opacity="0.5"/>
  <circle cx="1750" cy="575" r="30" fill="#3a4a2a" opacity="0.4"/>
  <!-- Ground -->
  <rect y="700" width="1920" height="380" fill="url(#ground)"/>
</svg>