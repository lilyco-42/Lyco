<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1414"/>
      <stop offset="60%" stop-color="#4a2a1a"/>
      <stop offset="100%" stop-color="#6a3a1a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a3a"/>
      <stop offset="100%" stop-color="#3a3024"/>
    </linearGradient>
    <radialGradient id="fire_glow" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect width="1920" height="1080" fill="url(#fire_glow)"/>
  <!-- Bookshelves -->
  <rect x="100" y="100" width="250" height="800" fill="#3a2a1a"/>
  <rect x="110" y="110" width="230" height="780" fill="#2a1a0a"/>
  <!-- Shelf lines -->
  <line x1="110" y1="200" x2="340" y2="200" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="110" y1="300" x2="340" y2="300" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="110" y1="400" x2="340" y2="400" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="110" y1="500" x2="340" y2="500" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="110" y1="600" x2="340" y2="600" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="110" y1="700" x2="340" y2="700" stroke="#4a3a2a" stroke-width="2"/>
  <!-- Books on shelves -->
  <rect x="120" y="210" width="15" height="90" fill="#6a4a3a"/>
  <rect x="140" y="220" width="12" height="80" fill="#5a3a2a"/>
  <rect x="158" y="215" width="18" height="85" fill="#7a5a3a"/>
  <rect x="182" y="230" width="10" height="70" fill="#4a3a2a"/>
  <rect x="120" y="310" width="20" height="90" fill="#5a4a3a"/>
  <rect x="145" y="320" width="14" height="80" fill="#6a5a3a"/>
  <rect x="165" y="315" width="16" height="85" fill="#4a3a2a"/>
  <!-- Second bookshelf -->
  <rect x="400" y="100" width="250" height="800" fill="#3a2a1a"/>
  <rect x="410" y="110" width="230" height="780" fill="#2a1a0a"/>
  <line x1="410" y1="200" x2="640" y2="200" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="410" y1="300" x2="640" y2="300" stroke="#4a3a2a" stroke-width="2"/>
  <line x1="410" y1="400" x2="640" y2="400" stroke="#4a3a2a" stroke-width="2"/>
  <!-- Reading table -->
  <rect x="750" y="500" width="400" height="20" fill="#4a3a2a"/>
  <rect x="770" y="520" width="12" height="200" fill="#4a3a2a"/>
  <rect x="1120" y="520" width="12" height="200" fill="#4a3a2a"/>
  <!-- Open book on table -->
  <polygon points="850,490 950,485 980,495 880,500" fill="#8a7a5a"/>
  <polygon points="950,485 1050,490 1080,500 980,495" fill="#9a8a6a"/>
  <!-- Smoke wisps -->
  <path d="M500 80 Q520 60 510 40 Q500 20 520 0" stroke="#aaa" stroke-width="3" fill="none" opacity="0.15"/>
  <path d="M550 100 Q570 80 560 50 Q550 20 570 0" stroke="#aaa" stroke-width="2" fill="none" opacity="0.1"/>
</svg>