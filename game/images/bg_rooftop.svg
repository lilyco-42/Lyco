<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="40%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#3a3a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.6" r="0.4">
      <stop offset="0%" stop-color="#ff6633" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6633" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- City glow on horizon -->
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- City silhouette -->
  <rect x="100" y="650" width="60" height="150" fill="#1a1a22" opacity="0.6"/>
  <rect x="180" y="620" width="40" height="180" fill="#1a1a22" opacity="0.6"/>
  <rect x="240" y="660" width="80" height="140" fill="#1a1a22" opacity="0.6"/>
  <rect x="350" y="640" width="50" height="160" fill="#1a1a22" opacity="0.6"/>
  <rect x="420" y="670" width="70" height="130" fill="#1a1a22" opacity="0.6"/>
  <rect x="520" y="650" width="45" height="150" fill="#1a1a22" opacity="0.6"/>
  <!-- Parapet/railing silhouette -->
  <rect x="0" y="780" width="1920" height="15" fill="#1a1a22"/>
  <rect x="0" y="795" width="1920" height="285" fill="#14141a"/>
  <!-- Roof surface -->
  <rect x="0" y="780" width="1920" height="15" fill="#2a2a3a" opacity="0.3"/>
  <!-- Stars -->
  <circle cx="200" cy="100" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="600" cy="60" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="1000" cy="130" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="1500" cy="80" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="800" cy="200" r="1" fill="#fff" opacity="0.15"/>
  <circle cx="1300" cy="180" r="1.2" fill="#fff" opacity="0.2"/>
</svg>