<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <radialGradient id="skylight" cx="0.8" cy="0.2" r="0.3">
      <stop offset="0%" stop-color="#8a8a7a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a8a7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sloped ceiling -->
  <polygon points="0,0 1920,0 1920,300 1200,200 800,250 0,400" fill="#2a2018"/>
  <!-- Wall -->
  <rect y="300" width="1920" height="500" fill="url(#wall)"/>
  <!-- Floor -->
  <rect y="800" width="1920" height="280" fill="#1a1410"/>
  <!-- Skylight -->
  <polygon points="1400,80 1600,60 1600,120 1400,140" fill="#4a4a3a"/>
  <polygon points="1410,90 1590,72 1590,112 1410,130" fill="#6a6a5a" opacity="0.3"/>
  <!-- Light beam from skylight -->
  <polygon points="1410,130 1590,112 1600,800 1400,800" fill="#8a8a7a" opacity="0.04"/>
  <!-- Wooden trunk -->
  <rect x="600" y="650" width="200" height="150" fill="#3a2a1a" rx="3"/>
  <rect x="610" y="645" width="180" height="8" fill="#4a3a2a" rx="2"/>
  <!-- Trunk latch -->
  <rect x="690" y="680" width="20" height="40" fill="#5a4a3a" rx="1"/>
  <!-- Old boxes -->
  <rect x="1000" y="700" width="120" height="100" fill="#3a2a1a"/>
  <rect x="1150" y="720" width="80" height="80" fill="#3a3024"/>
  <!-- Dust motes in light -->
  <circle cx="1450" cy="300" r="1.5" fill="#aaa" opacity="0.12"/>
  <circle cx="1480" cy="400" r="1" fill="#aaa" opacity="0.1"/>
  <circle cx="1430" cy="500" r="1.5" fill="#aaa" opacity="0.08"/>
  <circle cx="1500" cy="350" r="1" fill="#aaa" opacity="0.1"/>
  <!-- Scattered items on floor -->
  <rect x="300" y="780" width="50" height="10" fill="#6a5a3a" opacity="0.5"/>
  <rect x="800" y="790" width="40" height="8" fill="#5a4a3a" opacity="0.4"/>
</svg>