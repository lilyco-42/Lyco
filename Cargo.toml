[package]
name = "lyco"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.34"
egui = "0.34"
surge-ping = "0.8"
ssh2 = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getifaddrs = "0.4"
rust-i18n = "3"
sys-locale = "0.3"
